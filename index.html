<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mob Graphwar</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <main class="app-shell cockpit-shell" data-ui-version="cockpit-v2">
      <header class="topbar command-center">
        <div class="brand-block">
          <span class="eyebrow">Function Artillery Cockpit</span>
          <h1>Mob Graphwar</h1>
          <p>Human intent, model judgment, constrained curves.</p>
        </div>
        <div class="seed-controls match-controls">
          <label>
            Seed
            <input id="seedInput" type="number" min="1" max="999999" value="7351" />
          </label>
          <button id="resetBtn" type="button">Reset</button>
          <button id="nextBtn" class="primary-action" type="button">Lock Shot</button>
          <button id="runBtn" type="button">Run Battle</button>
          <button id="autoBtn" type="button">Auto</button>
        </div>
      </header>

      <section class="status-strip hud-grid" id="statusStrip" aria-live="polite"></section>

      <section class="workspace cockpit-grid">
        <section class="play-panel battle-stack" aria-label="Battle cockpit">
          <section class="battlefield-panel tactical-board" aria-label="Battlefield">
            <div class="board-overlay">
              <span id="mapBadge">Map</span>
              <span id="activeBadge">Ready</span>
            </div>
            <svg id="battlefield" viewBox="0 0 1000 600" role="img" aria-label="Mob Graphwar battlefield"></svg>
          </section>

          <section class="command-row command-deck" aria-label="Agent commands">
            <label class="command-box order-terminal team-a">
              <span>Agent A battle order <b id="commandCountA">0/80</b></span>
              <textarea id="commandA" maxlength="80"></textarea>
            </label>
            <label class="command-box order-terminal team-b">
              <span>Agent B battle order <b id="commandCountB">0/80</b></span>
              <textarea id="commandB" maxlength="80"></textarea>
            </label>
          </section>

          <section class="hand-panel card-rack">
            <div class="panel-heading inline-heading">
              <h2 id="handTitle">Current Hand</h2>
              <span id="handHint">Visible before lock-in</span>
            </div>
            <div id="handRead" class="hand-read" aria-live="polite"></div>
            <div id="handCards" class="cards"></div>
          </section>
        </section>

        <aside class="side-panel tactical-rail">
          <section class="provider-panel rail-card">
            <div class="panel-heading">
              <h2>Agent Source</h2>
              <span id="providerStatus">Local</span>
            </div>
            <div class="provider-form">
              <label class="provider-toggle">
                <input id="providerEnabled" type="checkbox" />
                <span>Live</span>
              </label>
              <label>
                Provider
                <select id="providerSelect"></select>
              </label>
              <label>
                Model
                <input id="providerModel" type="text" autocomplete="off" />
              </label>
              <label>
                API Key
                <input id="providerKey" type="password" autocomplete="off" />
              </label>
            </div>
          </section>

          <section class="rail-card shot-card">
            <div class="panel-heading">
              <h2>Current Shot</h2>
              <button id="copyTraceBtn" type="button">Copy Trace</button>
            </div>
            <div id="shotSummary" class="shot-summary"></div>
          </section>

          <section class="rail-card thinking-card">
            <div class="panel-heading">
              <h2>AI Thinking</h2>
            </div>
            <div id="thinkingPanel" class="thinking-panel"></div>
          </section>

          <section class="rail-card timeline-card">
            <div class="panel-heading">
              <h2>Battle Timeline</h2>
              <span>16 turns</span>
            </div>
            <div id="battleTimeline" class="battle-timeline" aria-label="Battle timeline"></div>
          </section>

          <section class="rail-card log-card">
            <div class="panel-heading">
              <h2>Event Log</h2>
            </div>
            <ol id="eventLog" class="event-log"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script src="src/sim-core.js?v=12"></script>
    <script src="src/app.js?v=12"></script>
  </body>
</html>
