<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mob Graphwar</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Mob Graphwar</h1>
          <p>One battle order. New hands every turn. One impossible function shot.</p>
        </div>
        <div class="seed-controls">
          <label>
            Seed
            <input id="seedInput" type="number" min="1" max="999999" value="7351" />
          </label>
          <button id="resetBtn" type="button">Reset</button>
          <button id="nextBtn" class="primary-action" type="button">Lock Shot</button>
          <button id="runBtn" type="button">Run Battle</button>
          <button id="autoBtn" type="button">Auto</button>
        </div>
      </header>

      <section class="status-strip" id="statusStrip" aria-live="polite"></section>

      <section class="workspace">
        <section class="play-panel" aria-label="Battle cockpit">
          <section class="battlefield-panel" aria-label="Battlefield">
            <div class="board-overlay">
              <span id="mapBadge">Map</span>
              <span id="activeBadge">Ready</span>
            </div>
            <svg id="battlefield" viewBox="0 0 1000 600" role="img" aria-label="Mob Graphwar battlefield"></svg>
          </section>

          <section class="command-row" aria-label="Agent commands">
            <label class="command-box team-a">
              <span>Agent A battle order <b id="commandCountA">0/80</b></span>
              <textarea id="commandA" maxlength="80">只打B2，安全高抛越塔，禁用冒险牌，别误伤队友。</textarea>
            </label>
            <label class="command-box team-b">
              <span>Agent B battle order <b id="commandCountB">0/80</b></span>
              <textarea id="commandB" maxlength="80">锁定A2，高抛越墙，保守避友，不用volatile。</textarea>
            </label>
          </section>

          <section class="hand-panel">
            <div class="panel-heading inline-heading">
              <h2 id="handTitle">Current Hand</h2>
              <span id="handHint">Visible before lock-in</span>
            </div>
            <div id="handRead" class="hand-read" aria-live="polite"></div>
            <div id="handCards" class="cards"></div>
          </section>
        </section>

        <aside class="side-panel">
          <section class="provider-panel">
            <div class="panel-heading">
              <h2>Agent Source</h2>
              <span id="providerStatus">Local</span>
            </div>
            <div class="provider-form">
              <label class="provider-toggle">
                <input id="providerEnabled" type="checkbox" />
                <span>Live</span>
              </label>
              <label>
                Provider
                <select id="providerSelect"></select>
              </label>
              <label>
                Model
                <input id="providerModel" type="text" autocomplete="off" />
              </label>
              <label>
                API Key
                <input id="providerKey" type="password" autocomplete="off" />
              </label>
            </div>
          </section>

          <section>
            <div class="panel-heading">
              <h2>Current Shot</h2>
              <button id="copyTraceBtn" type="button">Copy Trace</button>
            </div>
            <div id="shotSummary" class="shot-summary"></div>
          </section>

          <section>
            <div class="panel-heading">
              <h2>AI Thinking</h2>
            </div>
            <div id="thinkingPanel" class="thinking-panel"></div>
          </section>

          <section>
            <div class="panel-heading">
              <h2>Event Log</h2>
            </div>
            <ol id="eventLog" class="event-log"></ol>
          </section>
        </aside>
      </section>
    </main>

    <script src="src/sim-core.js?v=10"></script>
    <script src="src/app.js?v=10"></script>
  </body>
</html>
